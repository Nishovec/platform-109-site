function wireGraphs(){
 for(const [id,config] of diagrams){
  const canvas=$('[data-canvas="'+id+'"]');
  if(!canvas)continue;
  const svg=$('svg',canvas),group=$('[data-viewport]',svg);
  const tools=$('[data-diagram="'+id+'"]');
  let scale=1,x=0,y=0,drag=null,moved=false;
  const update=()=>group.setAttribute('transform','translate('+x+' '+y+') scale('+scale+')');
  tools.addEventListener('click',e=>{
   if(e.target.hasAttribute('data-svg')){
    const copy=svg.cloneNode(true);
    copy.querySelector('[data-viewport]').removeAttribute('transform');
    copy.setAttribute('width',config.width);copy.setAttribute('height',config.height);
    download('109-'+id+'.svg',new XMLSerializer().serializeToString(copy),'image/svg+xml;charset=utf-8');return;
   }
   if(!e.target.hasAttribute('data-zoom'))return;
   const delta=Number(e.target.dataset.zoom),next=Math.max(.65,Math.min(3,scale+delta));
   if(delta){x=(x-config.width/2)*next/scale+config.width/2;y=(y-config.height/2)*next/scale+config.height/2;scale=next}
   else{scale=1;x=0;y=0}
   update();
  });
  const point=e=>new DOMPoint(e.clientX,e.clientY).matrixTransform(svg.getScreenCTM().inverse());
  svg.addEventListener('pointerdown',e=>{
   if(e.button!==0)return;
   drag={id:e.pointerId,last:point(e),clientX:e.clientX,clientY:e.clientY};moved=false;
  });
  svg.addEventListener('pointermove',e=>{
   if(!drag||drag.id!==e.pointerId)return;
   if(!moved&&Math.hypot(e.clientX-drag.clientX,e.clientY-drag.clientY)<4)return;
   if(!moved){moved=true;svg.setPointerCapture(e.pointerId)}
   const p=point(e);x+=p.x-drag.last.x;y+=p.y-drag.last.y;drag.last=p;update();
  });
  for(const event of ['pointerup','pointercancel','lostpointercapture'])svg.addEventListener(event,()=>{drag=null});
  svg.addEventListener('pointerleave',()=>{if(!moved)drag=null});
  const activate=e=>{
   const node=e.target.closest('[data-node]');
   if(node)config.callbacks[Number(node.dataset.node)]?.();
  };
  svg.addEventListener('click',e=>{if(!moved||e.detail===0)activate(e);moved=false});
  svg.addEventListener('keydown',e=>{if(['Enter',' '].includes(e.key)){e.preventDefault();activate(e)}});
 }
}

function numericReport(value,type){

function channelCounts(value){

  'process-select':()=>{state.step=processes.findIndex(r=>r[0]===select.value)},
  'report-year':()=>{period[0]=Number(select.value);save('period',period)},
  'report-half':()=>{period[1]=select.value;save('period',period)},
  'compare-0':()=>{compare[0]=select.value;save('report-regions',compare)},
  'compare-1':()=>{compare[1]=select.value;save('report-regions',compare)},
  'asis-period':()=>{state.asisPeriod=submittedPeriods.find(key=>periodLabel(key)===select.value)},
  'actual-region':()=>{state.actualRegion=select.value},
  'actual-period':()=>{state.actualPeriod=submittedPeriods.find(key=>periodLabel(key)===select.value)},
  'gap-report-region':()=>{state.gapReportRegion=select.value},
  'mio-scope':()=>{state.mioScope=select.value},
  'mio-period':()=>{state.mioPeriod=submittedPeriods.find(key=>periodLabel(key)===select.value)}
 };
 if(select.id&&Object.hasOwn(updates,select.id))updates[select.id]();
 else if(select.dataset.demofilter)(state.demo??={})[select.dataset.demofilter]=select.value;
 else if(select.dataset.gapfilter)(state.gap??={})[select.dataset.gapfilter]=select.value;
 else return;
 const replacement=select.id?'#'+select.id:select.dataset.demofilter?'[data-demofilter="'+select.dataset.demofilter+'"]':'[data-gapfilter="'+select.dataset.gapfilter+'"]';
 render();$(replacement,main)?.focus({preventScroll:true});
});
main.addEventListener('input',e=>{
 const input=e.target;
 if(input.id==='notes'){
  $('#notes-status').textContent=save('notes',input.value)?'Сохранено в браузере.':'Хранилище недоступно. Скопируйте заметки перед закрытием.';
 }
 if(input.hasAttribute('data-confirmed-row')){
  const i=Number(input.dataset.confirmedRow),j=Number(input.dataset.confirmedCol),key=period.join('-');
  const region=compare[j];
  const [name,edits]=regionEdits(key,region);
  if(input.value===(reportEntry(region,key)?.values[i]??''))delete edits[i];else edits[i]=input.value;
  if(!save(name,edits))$('#report-storage').textContent='Хранилище недоступно. Правки остаются в этой вкладке до закрытия.';
  const cell=reportCell(region,key,i);
  input.nextElementSibling.textContent=cell.value;
  const note=input.nextElementSibling.nextElementSibling;
  note.textContent=cell.issue||(cell.edited?'Локальная правка':'');
  note.classList.toggle('flagged',Boolean(cell.issue));
  input.removeAttribute('aria-invalid');
  if(input.value.trim()&&!cellValid(cell,i))input.setAttribute('aria-invalid','true');
  $('[data-delta="'+i+'"]').textContent=confirmedDelta(i,compare.map(r=>reportCell(r,key,i)));
  statsStatus();
 }
 if(input.hasAttribute('data-report-row')){
  const i=Number(input.dataset.reportRow),j=Number(input.dataset.reportRegion);
  const data=reportData();data[i][j]=input.value;
  input.nextElementSibling.textContent=input.value;
  if(!save(periodKey(),data))$('#report-storage').textContent='Хранилище недоступно. Значения для этого сеанса можно выгрузить.';
  input.toggleAttribute('aria-invalid',false);
  if(input.value.trim()&&!validReport(input.value,i))input.setAttribute('aria-invalid','true');
  $('[data-delta="'+i+'"]').textContent=delta(i,data[i]);reportProgress();
 }
});
main.addEventListener('submit',e=>{
 if(e.target.id!=='add-region')return;
 e.preventDefault();
 const input=new FormData(e.target),title=String(input.get('title')).trim();
 if(!title)return;
 const data=read('extra-regions',[]);
 data.push([title,String(input.get('detail')).trim()]);
 if(save('extra-regions',data))render();
 else $('#region-status').textContent='Сохранение недоступно в этом браузере.';
});
render();


</script></body></html>
